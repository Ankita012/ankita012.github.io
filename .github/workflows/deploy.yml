name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: vite_react_shadcn_ts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vite_react_shadcn_ts

      - name: Build
        run: npm run build
        working-directory: vite_react_shadcn_ts

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: vite_react_shadcn_ts/dist